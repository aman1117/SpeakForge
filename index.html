<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SpeakForge</title>
  <meta name="description" content="A daily speaking workout for fluent, precise, clear and confident English." />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#150c18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Main">
      <a href="#/home" class="brand"><span class="mark" aria-hidden="true"></span>SpeakForge</a>
      <nav id="nav"></nav>
      <div id="xpbar" class="xp"></div>
      <a href="#/settings" class="mgear" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></a>
      <div id="engine" class="engine"></div>
    </aside>
    <div class="stagewrap">
      <div id="warn" class="warn hidden" role="status"></div>
      <div id="wslot"></div>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
